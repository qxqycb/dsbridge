<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 10px 12px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      #state {
        font-weight: 700;
      }
      .on {
        color: #1a7f37;
      }
      .off {
        color: #b00020;
      }
      button {
        font: inherit;
        padding: 3px 10px;
        cursor: pointer;
      }
      #log {
        height: 190px;
        overflow-y: auto;
        white-space: pre-wrap;
        border-top: 1px solid #ddd;
        padding-top: 6px;
      }
      #log div {
        color: #333;
      }
      #clear {
        margin-top: 6px;
        width: 100%;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="state">…</span>
      <button id="toggle">…</button>
    </header>
    <div id="log"></div>
    <button id="clear">清空记录</button>
    <script src="popup.js"></script>
  </body>
</html>
